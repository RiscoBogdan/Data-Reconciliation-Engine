# ─── SLF4J Simple Logger configuration ────────────────────────────────────────
# Show timestamp, level, and thread in every log line
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# ─── Global default level ─────────────────────────────────────────────────────
org.slf4j.simpleLogger.defaultLogLevel=INFO

# ─── App packages — verbose ───────────────────────────────────────────────────
org.slf4j.simpleLogger.log.com.reconciler=DEBUG

# ─── Noisy third-party loggers — quiet them down ─────────────────────────────
org.slf4j.simpleLogger.log.org.eclipse.jetty=WARN
org.slf4j.simpleLogger.log.io.javalin=INFO
org.slf4j.simpleLogger.log.net.snowflake=WARN
org.slf4j.simpleLogger.log.oracle=WARN

